# GitHub: Settings > Pages > Source = GitHub Actions seçin.
# actions etkinleştirildikten sonra Actions > Günlük bülten > Run workflow ile ilk çalışmayı yapın.
# 10:00 UTC = 13:00 Türkiye; GitHub cron yoğunlukta gecikebilir, kesin dakika garantisi yoktur.
name: Günlük bülten
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/collect.py
      # Arşivi Git deposunda sakla; yeni gün eski dosyaları silmez.
      - name: Arşivi kaydet
        run: |
          git config user.name 'gundem-bot'
          git config user.email 'gundem-bot@users.noreply.github.com'
          git add dist/data
          git diff --staged --quiet || git commit -m 'Günlük haber arşivini güncelle'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
